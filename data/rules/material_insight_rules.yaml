rules:
  - rule_id: OBJECT_TYPE_REQUIRED
    condition:
      field: object_type
      operator: is_null
    result:
      severity: high
      issue_code: object_type_missing
      message: 객체 유형을 확인할 수 없어 재료와 두께를 확정 추천할 수 없습니다.
      field: object_type
      requires_rag: false
      requires_expert_review: false

  - rule_id: SPACE_TYPE_REQUIRED
    condition:
      field: space_type
      operator: is_null
    result:
      severity: low
      issue_code: space_type_missing
      message: 공간 용도 정보가 없어 추천의 정확도가 낮습니다.
      field: space_type
      requires_rag: false
      requires_expert_review: false

  - rule_id: WALL_MATERIAL_REQUIRED
    target_object_type: interior_wall
    condition:
      field: material
      operator: is_null
    result:
      severity: medium
      issue_code: material_missing
      message: 벽체 재료 정보가 입력되어 있지 않습니다.
      field: material
      requires_rag: true
      requires_expert_review: false

  - rule_id: FINISH_MATERIAL_REQUIRED
    target_object_type:
      - floor_finish
      - ceiling
    condition:
      field: material
      operator: is_null
    result:
      severity: medium
      issue_code: material_missing
      message: 마감 재료 정보가 입력되어 있지 않습니다.
      field: material
      requires_rag: true
      requires_expert_review: false

  - rule_id: WALL_THICKNESS_REQUIRED
    target_object_type: interior_wall
    condition:
      field: thickness_mm
      operator: is_null
    result:
      severity: medium
      issue_code: thickness_missing
      message: 벽체 두께 정보가 입력되어 있지 않습니다.
      field: thickness_mm
      requires_rag: true
      requires_expert_review: false

  - rule_id: MEETING_ROOM_WALL_THICKNESS_REVIEW
    target_object_type: interior_wall
    condition:
      all:
        - field: space_type
          operator: equals
          value: meeting_room
        - field: thickness_mm
          operator: less_than
          value: 100
    result:
      severity: medium
      issue_code: thickness_review_required
      message: 회의실 구획벽의 두께와 차음 성능 검토가 필요합니다.
      field: thickness_mm
      requires_rag: true
      requires_expert_review: false

  - rule_id: ACOUSTIC_WALL_REVIEW
    target_object_type: interior_wall
    condition:
      field: user_attributes.acoustic_required
      operator: equals
      value: true
    result:
      severity: medium
      issue_code: acoustic_review_required
      message: 차음 요구가 있는 벽체이므로 관련 구성과 성능 검토가 필요합니다.
      field: user_attributes.acoustic_required
      requires_rag: true
      requires_expert_review: false

  - rule_id: FIRE_RATING_EXPERT_REVIEW
    condition:
      all:
        - field: user_attributes.fire_required
          operator: equals
          value: true
        - field: user_attributes.fire_rating
          operator: is_null
    result:
      severity: high
      issue_code: expert_review_required
      message: 내화 성능 입력이 필요한 객체입니다. 전문가 검토가 필요합니다.
      field: user_attributes.fire_rating
      requires_rag: true
      requires_expert_review: true

  - rule_id: STRUCTURAL_SLAB_EXPERT_REVIEW
    target_object_type: slab
    condition:
      field: user_attributes.structural_role
      operator: equals
      value: load_bearing
    result:
      severity: high
      issue_code: expert_review_required
      message: 구조 관련 슬래브 항목은 전문가 검토가 필요합니다.
      field: user_attributes.structural_role
      requires_rag: true
      requires_expert_review: true

  - rule_id: RESTROOM_CARPET_MATERIAL_REVIEW
    target_object_type: floor_finish
    condition:
      all:
        - field: space_type
          operator: equals
          value: restroom
        - field: material
          operator: contains
          value: carpet
    result:
      severity: medium
      issue_code: material_performance_review_required
      message: 습식 공간에 부적절할 수 있는 바닥 마감재입니다. 방수와 유지관리 성능 검토가 필요합니다.
      field: material
      requires_rag: true
      requires_expert_review: false
